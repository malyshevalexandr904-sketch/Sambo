# Аудит зависимостей (SECURITY.md): pnpm audit по production-зависимостям, порог high.
# Вынесен из ci.yml: новые advisory появляются независимо от нашего кода (в т. ч. на транзитивных зависимостях),
# и не должны блокировать несвязанные PR и main. Запускается:
#   - раз в сутки по расписанию (падение шлёт уведомление владельцу репозитория);
#   - вручную (Actions → Dependency audit → Run workflow);
#   - в PR, которые меняют зависимости, — чтобы новая уязвимая зависимость не попала в main.
# Найденную уязвимость чинят обновлением или pnpm.overrides в package.json, а не отключением проверки.
name: Dependency audit

on:
  schedule:
    - cron: '17 5 * * *' # 08:17 по Москве
  workflow_dispatch:
  pull_request:
    paths:
      - 'pnpm-lock.yaml'
      - 'package.json'
      - '**/package.json'
      - '.github/workflows/audit.yml'

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: pnpm audit (prod, high)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high
