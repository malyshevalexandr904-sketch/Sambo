# Локальное окружение (раздел 50 ТЗ): docker compose up --build
# Сервисы: postgres, redis, minio (S3), mailpit (почта), migrate (миграции + seed), api, worker, web.
# Адреса для браузера: веб — http://localhost:3000, письма — http://localhost:8025, MinIO — http://localhost:9001.

x-app-env: &app-env
  env_file: .env
  environment:
    # Локально по http: secure-cookie выключены, поэтому режим development (production это запрещает).
    NODE_ENV: development
    COOKIE_SECURE: 'false'
    DATABASE_URL: postgresql://sde_app:sde_dev_app@postgres:5432/sde
    DATABASE_ADMIN_URL: postgresql://sde:sde_dev_owner@postgres:5432/sde
    REDIS_URL: redis://redis:6379
    STORAGE_ENDPOINT: http://minio:9000
    STORAGE_PUBLIC_ENDPOINT: http://localhost:9000
    STORAGE_PUBLIC_URL: http://localhost:9000/sde-public-media
    STORAGE_FORCE_PATH_STYLE: 'true'
    EMAIL_PROVIDER: smtp
    SMTP_HOST: mailpit
    SMTP_PORT: '1025'
    APP_URL: http://localhost:3000

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sde
      POSTGRES_PASSWORD: sde_dev_owner
      POSTGRES_DB: sde
      SDE_APP_PASSWORD: sde_dev_app
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    ports: ['5432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sde -d sde']
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 20

  # MinIO прекратил публикацию образов: с осени 2025 репозитории quay.io/minio и minio/* в Docker Hub закрыты
  # (pull отвечает 401). Для разработки — замороженный образ Bitnami с сервером MinIO и клиентом mc.
  # Только локальная разработка; production — S3 облачного провайдера (решение Q-07).
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5@sha256:6dabb4a2088c9a79908de3bc05f4586c23ad2182c8908e7e3acbf61c1467fb20
    environment:
      MINIO_ROOT_USER: sde-dev
      MINIO_ROOT_PASSWORD: sde-dev-secret
      MINIO_CONSOLE_PORT_NUMBER: '9001'
    volumes: [miniodata:/bitnami/minio/data]
    ports: ['9000:9000', '9001:9001']
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:9000/minio/health/live']
      interval: 5s
      retries: 20

  # Buckets: публичные медиа читаются анонимно, документы — только по presigned URL (ARCHITECTURE.md, 18).
  minio-init:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5@sha256:6dabb4a2088c9a79908de3bc05f4586c23ad2182c8908e7e3acbf61c1467fb20
    depends_on:
      minio: { condition: service_healthy }
    environment:
      HOME: /tmp
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 sde-dev sde-dev-secret &&
      mc mb --ignore-existing local/sde-public-media local/sde-private-documents local/sde-generated &&
      mc anonymous set download local/sde-public-media &&
      mc anonymous set none local/sde-private-documents &&
      mc anonymous set none local/sde-generated &&
      (mc cors set local/sde-private-documents --allowed-origins http://localhost:3000 --allowed-methods POST,GET || true)
      "

  mailpit:
    image: axllent/mailpit:latest
    ports: ['8025:8025', '1025:1025']

  # Миграции, учебные данные и подготовка демонстрационных турниров (жеребьёвки, расписание, бригады —
  # через код API, apps/api/scripts/seed-schedule.ts; ему нужен Redis). Повторный запуск ничего не дублирует.
  migrate:
    build: { context: ., dockerfile: infra/docker/Dockerfile.api, target: migrate }
    <<: *app-env
    command:
      - sh
      - -c
      - >-
        ./node_modules/.bin/prisma migrate deploy &&
        ./node_modules/.bin/tsx seed/index.ts &&
        cd /repo/apps/api && node -r @swc-node/register scripts/seed-schedule.ts
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  api:
    build: { context: ., dockerfile: infra/docker/Dockerfile.api, target: api }
    <<: *app-env
    ports: ['4000:4000']
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }

  worker:
    build: { context: ., dockerfile: infra/docker/Dockerfile.api, target: worker }
    <<: *app-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
      target: web
      args: { API_INTERNAL_URL: 'http://api:4000' }
    environment:
      API_INTERNAL_URL: http://api:4000
      STORAGE_UPLOAD_ORIGIN: http://localhost:9000
    ports: ['3000:3000']
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  miniodata:
